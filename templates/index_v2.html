<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Search - AI-Powered Product Discovery</title>
    
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/phosphor-icons/1.4.2/fill.css">
    
    <style>
        /* CSS Variables for theming */
        :root {
            --primary: #1a1f36;
            --secondary: #007bff;
            --accent: #00d4ff;
            --bg-dark: #0f1419;
            --surface: #1c2028;
            --surface-light: #252b36;
            --text-primary: #ffffff;
            --text-secondary: #8b92a8;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--surface);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--surface-light);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* App Container */
        .app-container {
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #151922 100%);
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .logo {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            list-style: none;
            padding: 1rem 0;
            flex: 1;
        }

        .nav-item {
            position: relative;
            margin: 0.25rem 1rem;
            border-radius: var(--radius);
            transition: var(--transition);
            cursor: pointer;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            padding: 0.875rem 1.25rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-item:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        .nav-item.active {
            background: rgba(0, 212, 255, 0.15);
        }

        .nav-item.active a {
            color: var(--accent);
        }

        .nav-item i {
            font-size: 1.25rem;
            margin-right: 1rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: rgba(28, 32, 40, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* Status Badge */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 20px;
            font-size: 0.875rem;
        }

        .status-badge.error {
            background: rgba(255, 0, 0, 0.1);
            border-color: rgba(255, 0, 0, 0.3);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Content Views */
        .view-container {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Search Cards */
        .search-section {
            background: rgba(28, 32, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .search-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .section-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.875rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: var(--surface-light);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface);
            border-color: var(--accent);
        }

        /* File Upload Area */
        .file-upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 3rem;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .file-upload-area:hover {
            border-color: var(--accent);
            background: rgba(0, 212, 255, 0.05);
        }

        .file-upload-area.drag-over {
            border-color: var(--accent);
            background: rgba(0, 212, 255, 0.1);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .file-input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* Results Grid */
        .results-container {
            margin-top: 2rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .result-card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            position: relative;
        }

        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        .result-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--surface-light);
        }

        .result-content {
            padding: 1.25rem;
        }

        .result-sku {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .result-details {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .similarity-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0, 212, 255, 0.9);
            color: white;
            padding: 0.375rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        /* Batch Viewer Specific Styles */
        .batch-viewer {
            display: flex;
            height: calc(100vh - 100px);
            gap: 2rem;
            padding: 2rem;
        }

        .input-panel {
            width: 400px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .input-image-container {
            width: 100%;
            height: 300px;
            background: var(--surface-light);
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .input-details {
            flex: 1;
            overflow-y: auto;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .detail-value {
            font-weight: 500;
        }

        .navigation-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .nav-button {
            background: var(--surface-light);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .nav-button:hover:not(:disabled) {
            background: var(--accent);
            transform: scale(1.1);
        }

        .nav-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-info {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .results-panel {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            overflow-y: auto;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .results-count {
            font-size: 1.125rem;
            font-weight: 600;
        }

        /* Loading States */
        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, var(--surface-light) 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            height: 280px;
            border-radius: var(--radius);
            margin-bottom: 1rem;
        }

        /* Hidden by default */
        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .batch-viewer {
                flex-direction: column;
            }

            .input-panel {
                width: 100%;
                height: auto;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }

            .nav-item span,
            .logo h1 {
                display: none;
            }

            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <h1>Vision Search</h1>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-view="image-search">
                    <a href="#">
                        <i class="ph-camera"></i>
                        <span>Image Search</span>
                    </a>
                </li>
                <li class="nav-item" data-view="sku-search">
                    <a href="#">
                        <i class="ph-barcode"></i>
                        <span>SKU Search</span>
                    </a>
                </li>
                <li class="nav-item" data-view="batch-search">
                    <a href="#">
                        <i class="ph-file-xls"></i>
                        <span>Batch Search</span>
                    </a>
                </li>
                <li class="nav-item" data-view="batch-viewer">
                    <a href="#">
                        <i class="ph-eye"></i>
                        <span>Batch Viewer</span>
                    </a>
                </li>
                <li class="nav-item" data-view="filter-search">
                    <a href="#">
                        <i class="ph-funnel"></i>
                        <span>Filter Search</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer" style="padding: 2rem; border-top: 1px solid var(--border);">
                <div class="index-selector">
                    <label class="form-label">Active Index</label>
                    <select class="form-control" id="index-select">
                        {% for index in indexes %}
                        <option value="{{ index.id }}" {% if index.id == current_index_id %}selected{% endif %}>
                            {{ index.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h2 class="page-title" id="page-title">Image Search</h2>
                <div class="header-actions">
                    <div class="status-badge" id="status-badge">
                        <div class="status-indicator"></div>
                        <span>System Ready</span>
                    </div>
                </div>
            </header>

            <!-- Image Search View -->
            <div class="view active" id="image-search-view">
                <div class="view-container">
                    <div class="search-section">
                        <div class="section-header">
                            <div class="section-icon">
                                <i class="ph-camera"></i>
                            </div>
                            <div>
                                <h3 class="section-title">Search by Image</h3>
                                <p class="text-secondary">Upload an image to find similar products</p>
                            </div>
                        </div>
                        <form id="image-search-form">
                            <div class="file-upload-area" id="image-drop-zone">
                                <i class="ph-upload upload-icon"></i>
                                <h4>Drop image here or click to browse</h4>
                                <p class="text-secondary">Supports JPG, PNG, WebP</p>
                                <input type="file" class="file-input" id="image-file" accept="image/*">
                            </div>
                            <button type="submit" class="btn btn-primary" style="margin-top: 1.5rem; width: 100%;">
                                <i class="ph-magnifying-glass"></i>
                                Search Similar Products
                            </button>
                        </form>
                    </div>
                    <div class="results-container" id="image-results"></div>
                </div>
            </div>

            <!-- Batch Viewer -->
            <div class="view" id="batch-viewer-view">
                <div class="batch-viewer">
                    <div class="input-panel">
                        <div class="input-image-container">
                            <img class="input-image" id="batch-input-image" src="" alt="Input product">
                        </div>
                        <div class="input-details" id="batch-input-details">
                            <!-- Details will be populated dynamically -->
                        </div>
                        <div class="navigation-controls">
                            <button class="nav-button" id="batch-prev">
                                <i class="ph-caret-left"></i>
                            </button>
                            <span class="nav-info" id="batch-nav-info">1 / 10</span>
                            <button class="nav-button" id="batch-next">
                                <i class="ph-caret-right"></i>
                            </button>
                        </div>
                    </div>
                    <div class="results-panel">
                        <div class="results-header">
                            <h3 class="results-count">Similar Products (10)</h3>
                            <button class="btn btn-secondary" id="export-current">
                                <i class="ph-download"></i>
                                Export Results
                            </button>
                        </div>
                        <div class="results-grid" id="batch-results-grid">
                            <!-- Results will be populated dynamically -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Other views will be added here -->
        </div>
    </main>

    <script>
        // Initialize filter options from backend
        const filterOptions = {{ filter_options | tojson }};
        const initializationStatus = {{ initialization_status | tojson }};
        const indexes = {{ indexes | tojson }};

        // Navigation handling
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                // Update active nav
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                // Switch views
                const viewName = this.dataset.view;
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                const targetView = document.getElementById(viewName + '-view');
                if (targetView) {
                    targetView.classList.add('active');
                }
                
                // Update page title
                document.getElementById('page-title').textContent = this.querySelector('span').textContent;
            });
        });

        // Drag and drop for image upload
        const dropZone = document.getElementById('image-drop-zone');
        const fileInput = document.getElementById('image-file');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('drag-over');
        }

        function unhighlight(e) {
            dropZone.classList.remove('drag-over');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
        }

        // Image search form submission
        document.getElementById('image-search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = fileInput.files[0];
            if (!file) {
                alert('Please select an image');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            
            // Show loading state
            const resultsContainer = document.getElementById('image-results');
            resultsContainer.innerHTML = '<div class="skeleton skeleton-card"></div>'.repeat(6);

            try {
                const response = await fetch('/search/image', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (response.ok) {
                    displayImageResults(result.results);
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        });

        function displayImageResults(results) {
            const container = document.getElementById('image-results');
            
            if (!results || results.length === 0) {
                container.innerHTML = '<p class="text-secondary">No results found</p>';
                return;
            }

            const html = `
                <h3 style="margin-bottom: 1.5rem;">Found ${results.length} similar products</h3>
                <div class="results-grid">
                    ${results.map(result => `
                        <div class="result-card">
                            ${result.similarity_score !== undefined ? 
                                `<div class="similarity-badge">${((1 - result.similarity_score) * 100).toFixed(1)}%</div>` : 
                                ''}
                            <img src="/${result.image_path}" alt="${result.SKU_COD}" class="result-image">
                            <div class="result-content">
                                <div class="result-sku">${result.SKU_COD}</div>
                                <div class="result-details">
                                    <div><strong>Brand:</strong> ${result.BRAND_DES || 'N/A'}</div>
                                    <div><strong>Cluster:</strong> ${result.BRAND_CLUSTER || 'N/A'}</div>
                                    <div><strong>Shape:</strong> ${result.SHAPE_SEMI_GROUPED || 'N/A'}</div>
                                    <div><strong>Price:</strong> ${result.ACT_SKU_PRICE_VAL || 'N/A'}</div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            container.innerHTML = html;
        }

        // Batch viewer functionality (placeholder for now)
        class BatchViewer {
            constructor() {
                this.currentIndex = 0;
                this.batchResults = [];
            }

            loadResults(sessionId) {
                // Implementation will be added
            }

            navigate(direction) {
                // Implementation will be added
            }
        }

        const batchViewer = new BatchViewer();
    </script>
</body>
</html>
